body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:200px 1fr 96px;gap:10px;align-items:center;padding:3px 0;border-radius:6px}
.bar:hover{background:var(--accent-bg)}
.bar .n{color:var(--text-secondary);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{height:14px;background:var(--grid);border-radius:0 4px 4px 0}
.bar .f{height:14px;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.bar .f.m{background:var(--muted-bar)}
.bar .c{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px}
.bar .c small{color:var(--text-muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--text-secondary);font-weight:500;cursor:pointer;user-select:none;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap;}
td.nw{white-space:nowrap}
td.num,th.num{font-variant-numeric:tabular-nums}
a{color:var(--series-1);text-decoration:none}
a:hover{text-decoration:underline}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--grid);color:var(--text-secondary);font-size:12px;margin:1px 2px 1px 0}
.note{color:var(--text-muted);font-size:12px;margin-top:10px}
.excl{opacity:.6}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}

  const lost = new Set(D.lost);
  const order = Object.fromEntries(D.stageOrder.map((s,i) => [s,i]));
  const beyond = deals.filter(d => !lost.has(d.stage) && order[d.stage] > order['Исследование']).length;

  $('tiles').innerHTML = [
    [fmt(gs.length), who ? 'Гостей у сотрудника' : 'Гостей в сегменте', who ? 'из ' + fmt(segTotal) : ''],
    [fmt(gs.length - pc('todo')), 'Разобрано', pct(gs.length - pc('todo'), gs.length)],
    [fmt(pc('todo')), 'Не разобрано', pct(pc('todo'), gs.length)],
    [fmt(selected), 'Отобрано NewBiz', '«Новый лид» + «Действующий лид»'],
    [fmt(deals.length), 'Сделок в NewBiz', 'у ' + withDeal + ' гостей (' + pct(withDeal, gs.length) + ')'],
    [fmt(beyond), 'Дальше «Исследования»', pct(beyond, deals.length) + ' сделок'],
  ].map(([v,l,s]) => `<div class="tile"><div class="v">${v}</div><div class="l">${l}</div><div class="s">${s}</div></div>`).join('');

  bars($('procBars'), ['new','active','manual','auto','todo'].map(k => [D.procNames[k], pc(k)]), gs.length,
       new Set([D.procNames.auto, D.procNames.todo]));

  const sc = {}; deals.forEach(d => sc[d.stage] = (sc[d.stage]||0) + 1);
  bars($('stageBars'), D.stageOrder.filter(s => sc[s]).map(s => [s, sc[s]]), deals.length, lost);

  const rc = {}; gs.filter(g => g.reason).forEach(g => rc[g.reason] = (rc[g.reason]||0) + 1);
  bars($('reasonBars'), Object.entries(rc).sort((a,b) => b[1]-a[1]), gs.length);

  const wt = {}; G.filter(g => g.who && g.seg !== 'emp' && (seg === 'all' || g.seg === seg)).forEach(g => {
    wt[g.who] = wt[g.who] || {new:0,active:0,manual:0,deals:new Set()};
    if (wt[g.who][g.proc] !== undefined) wt[g.who][g.proc]++;
    g.nb.forEach(i => wt[g.who].deals.add(i));
  });
  $('whoTbl').innerHTML = '<tr><th>Сотрудник</th><th class="num">Новый лид</th><th class="num">Действующий лид</th><th class="num">Другие отказы</th><th class="num">Сделок NewBiz</th></tr>' +
    Object.entries(wt).sort((a,b) => (b[1].new+b[1].active+b[1].manual)-(a[1].new+a[1].active+a[1].manual))
      .map(([n,c]) => `<tr><td>${esc(n)}</td><td class="num">${c.new}</td><td class="num">${c.active}</td><td class="num">${c.manual}</td><td class="num">${c.deals.size}</td></tr>`).join('')
    + (Object.keys(wt).length ? '' : '<tr><td colspan="5" style="color:var(--text-muted)">В этом сегменте ручной разметки нет</td></tr>');

  // таблица сделок
  const q = $('q').value.trim().toLowerCase(), st = $('fStage').value, showEx = $('fExcl').checked;
  const gIds = new Set(gs.map(g => g.id));
  let rows = D.deals.filter(d => d.excluded ? (showEx && d.guests.some(x => gIds.has(x))) : dealIds.has(d.id));
  if (st) rows = rows.filter(d => d.stage === st);
  if (q) rows = rows.filter(d => (d.name + ' ' + d.resp + ' ' + d.company).toLowerCase().includes(q));
  const key = {stage: d => order[d.stage] ?? 99, name: d => d.name.toLowerCase(), resp: d => d.resp || '',
               created: d => d.created, budget: d => d.budget, guests: d => d.guests.length}[sortKey];
  rows.sort((a,b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * sortDir);
  const arrow = k => sortKey === k ? (sortDir > 0 ? ' ↑' : ' ↓') : '';
  $('dealTbl').innerHTML = `<tr><th data-k="name">Сделка${arrow('name')}</th><th data-k="stage">Этап${arrow('stage')}</th>
    <th data-k="resp">Ответственный${arrow('resp')}</th><th data-k="created">Создана${arrow('created')}</th>
    <th data-k="budget" class="num">Бюджет${arrow('budget')}</th><th data-k="guests">Гости в «Конференции 2026»${arrow('guests')}</th></tr>` +
    rows.map(d => `<tr class="${d.excluded ? 'excl' : ''}" ${d.excluded ? `title="${esc(d.excluded)}"` : ''}>
      <td><a href="${D.amo}${d.id}" target="_blank">${esc(d.name)}</a>${d.company ? `<br><small style="color:var(--text-muted)">${esc(d.company)}</small>` : ''}</td>
      <td>${esc(d.stage)}</td><td>${esc(d.resp)}</td><td class="nw">${d.created}</td>
      <td class="num">${d.budget ? fmt(d.budget) + ' ₽' : '—'}</td>
      <td>${d.guests.map(g => `<a class="pill" href="${D.amo}${g}" target="_blank">${g}</a>`).join('')}
        ${d.procs.map(p => `<span class="pill">${esc(D.procNames[p])}</span>`).join('')}</td></tr>`).join('');
  $('dealTbl').querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; render(); });
  $('dealNote').textContent = rows.length + ' сделок. Связь: сделка NewBiz создана после конференции и у неё тот же контакт, что у гостя (для «Новый лид» — или та же компания).'
    + (D.deals.some(d => d.excluded) ? ' Исключённые (действующие клиенты) не входят в цифры выше.' : '');
}
['fSeg','fWho','fStage','fExcl'].forEach(id => $(id).onchange = render);
$('q').oninput = render;
render();
</script>
</body>
</html>
